<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Comfort Watch: Korean, Japanese & Chinese Drama Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@400;600;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+SC:wght@600;900&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink: #17130f;
    --ink-soft: #211a14;
    --ink-line: #392e22;
    --paper: #f3ead9;
    --paper-dim: #ddccae;
    --text-loud: #f0e7d6;
    --text-quiet: #b3a58c;
    --text-faint: #7d715c;
    --seal: #dd5031;
    --seal-deep: #a3341c;
    --indigo: #55648f;
    --gold: #cca458;
    --jade: #5c8172;
    --radius: 9px;
    --font-display: 'Zen Old Mincho', 'Noto Serif KR', 'Noto Serif SC', serif;
    --font-body: 'Zen Kaku Gothic New', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
  }

  body{
    margin:0;
    background:var(--ink);
    color:var(--text-loud);
    font-family:var(--font-body);
    line-height:1.6;
    position:relative;
  }

  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
    opacity:0.04;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  }

  a{color:inherit;}

  .wrap{max-width:1060px;margin:0 auto;padding:0 24px;}

  .ticker-bar{
    border-bottom:1px solid var(--ink-line);
    background:var(--ink-soft);
    overflow:hidden;
    white-space:nowrap;
    padding:12px 0;
  }
  .ticker-track{
    display:inline-block;
    font-family:var(--font-display);
    font-style:italic;
    font-size:14px;
    letter-spacing:0.01em;
    color:var(--text-faint);
    animation:scrollTicker 90s linear infinite;
  }
  @keyframes scrollTicker{
    0%{transform:translateX(0);}
    100%{transform:translateX(-50%);}
  }
  @media (prefers-reduced-motion: reduce){
    .ticker-track{animation:none;}
  }
  .ticker-track span{margin:0 20px;color:var(--text-faint);}

  header.site{padding:22px 0 0;}
  .brandrow{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
  }
  .wordmark{
    font-family:var(--font-display);
    font-weight:600;
    font-size:23px;
    letter-spacing:0.01em;
  }
  .wordmark small{
    display:block;
    font-family:var(--font-body);
    font-size:11px;
    letter-spacing:0.06em;
    color:var(--text-faint);
    font-weight:500;
    margin-top:4px;
  }
  .header-right{display:flex;flex-direction:column;align-items:flex-end;gap:10px;}
  .lang-switch{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
  .lang-btn{
    font-family:var(--font-body);
    font-size:12px;
    font-weight:500;
    padding:5px 11px;
    border:1px solid var(--ink-line);
    background:var(--ink-soft);
    color:var(--text-quiet);
    border-radius:999px;
    cursor:pointer;
    transition:all .15s ease;
  }
  .lang-btn:hover{border-color:var(--paper-dim);color:var(--text-loud);}
  .lang-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .lang-btn[aria-pressed="true"]{
    background:var(--paper);
    color:var(--ink);
    border-color:transparent;
    font-weight:700;
  }
  .glyph-legend{
    display:flex;
    gap:16px;
    font-family:var(--font-body);
    font-size:13px;
    color:var(--text-quiet);
  }
  .glyph-legend b{color:var(--paper);font-family:var(--font-display);font-size:16px;font-weight:600;margin-right:5px;}

  .hero{
    padding:60px 0 54px;
    border-bottom:1px solid var(--ink-line);
  }
  .eyebrow{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    letter-spacing:0.08em;
    color:var(--seal);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  h1.headline{
    font-family:var(--font-display);
    font-weight:600;
    font-size:clamp(32px, 6vw, 58px);
    line-height:1.15;
    margin:0 0 22px;
    max-width:18ch;
  }
  .hero p.sub{
    font-size:16.5px;
    color:var(--text-quiet);
    max-width:56ch;
    margin:0 0 30px;
  }
  .btn{
    font-family:var(--font-body);
    font-weight:600;
    font-size:14px;
    letter-spacing:0.01em;
    border:1px solid var(--paper-dim);
    background:transparent;
    color:var(--text-loud);
    padding:13px 22px;
    border-radius:var(--radius);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:10px;
    transition:border-color .2s ease, color .2s ease, background .2s ease;
  }
  .btn:hover{border-color:var(--seal);color:var(--seal);}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
  .btn.primary{
    background:var(--seal);
    border-color:var(--seal);
    color:var(--ink);
  }
  .btn.primary:hover{
    background:var(--seal-deep);
    border-color:var(--seal-deep);
    color:var(--paper);
  }

  section.tuner{
    padding:52px 0;
    border-bottom:1px solid var(--ink-line);
  }
  .section-head{
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    gap:16px;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .section-head h2{
    font-family:var(--font-display);
    font-size:24px;
    font-weight:600;
    margin:0;
  }
  .section-head .count-note{
    font-family:var(--font-body);
    font-size:13px;
    color:var(--text-faint);
  }

  .field-label{
    font-family:var(--font-body);
    font-weight:600;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--text-faint);
    margin:0 0 12px;
  }

  .region-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:34px;
  }
  .chip-region{
    font-family:var(--font-body);
    font-weight:500;
    font-size:14.5px;
    border:1px solid var(--ink-line);
    background:var(--ink-soft);
    color:var(--text-quiet);
    padding:10px 18px;
    border-radius:var(--radius);
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition:all .18s ease;
  }
  .chip-region .glyph{font-family:var(--font-display);font-size:16px;}
  .chip-region:hover{border-color:var(--paper-dim);color:var(--text-loud);}
  .chip-region:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .chip-region[aria-pressed="true"]{
    color:var(--ink);
    border-color:transparent;
  }
  .chip-region[data-region="ALL"][aria-pressed="true"]{background:var(--paper);}
  .chip-region[data-region="KR"][aria-pressed="true"]{background:var(--indigo);color:var(--paper);}
  .chip-region[data-region="JP"][aria-pressed="true"]{background:var(--seal);color:var(--paper);}
  .chip-region[data-region="CN"][aria-pressed="true"]{background:var(--gold);color:var(--ink);}

  .mood-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(150px,1fr));
    gap:9px;
    margin-bottom:32px;
  }
  .chip-mood{
    font-family:var(--font-body);
    font-size:14px;
    border:1px solid var(--ink-line);
    background:var(--ink-soft);
    color:var(--text-quiet);
    padding:11px 14px;
    border-radius:var(--radius);
    cursor:pointer;
    text-align:left;
    transition:all .18s ease;
  }
  .chip-mood:hover{border-color:var(--paper-dim);color:var(--text-loud);}
  .chip-mood:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}
  .chip-mood[aria-pressed="true"]{
    background:var(--seal);
    border-color:var(--seal);
    color:var(--paper);
  }

  .tuner-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;
    align-items:center;
  }
  .clear-link{
    font-family:var(--font-body);
    font-size:13.5px;
    color:var(--text-faint);
    background:none;
    border:none;
    cursor:pointer;
    text-decoration:underline;
    text-underline-offset:3px;
    padding:8px 4px;
  }
  .clear-link:hover{color:var(--text-loud);}

  section.lineup{padding:52px 0 80px;}
  .results-meta{
    font-family:var(--font-body);
    font-size:14px;
    color:var(--text-faint);
    margin-top:6px;
  }
  .results-meta b{color:var(--gold);font-weight:700;}

  .bonus-slot{margin-bottom:26px;}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));
    gap:18px;
    margin-top:26px;
  }

  .card{
    position:relative;
    background:var(--paper);
    color:var(--ink);
    padding:22px 22px 24px;
    border:1px solid var(--ink-line);
    border-radius:calc(var(--radius) + 3px);
    display:flex;
    flex-direction:column;
    min-height:100%;
  }
  .card.bonus{
    border-color:var(--gold);
    box-shadow:0 0 0 1px var(--gold);
  }
  .card.pulse{animation:pulseGlow 1.6s ease-out 2;}
  @keyframes pulseGlow{
    0%{box-shadow:0 0 0 0 rgba(204,164,88,0.55);}
    70%{box-shadow:0 0 0 10px rgba(204,164,88,0);}
    100%{box-shadow:0 0 0 0 rgba(204,164,88,0);}
  }
  @media (prefers-reduced-motion: reduce){
    .card.pulse{animation:none;outline:2px solid var(--gold);}
  }

  .card-top{
    display:flex;
    justify-content:flex-end;
    margin-bottom:6px;
  }
  .stamp{width:50px;height:50px;flex-shrink:0;}

  .card h3{
    font-family:var(--font-display);
    font-size:21px;
    font-weight:600;
    margin:0 0 8px;
    line-height:1.25;
  }
  .card-meta{
    font-family:var(--font-body);
    font-size:13px;
    color:var(--text-faint);
    margin-bottom:12px;
    display:flex;
    align-items:center;
    gap:8px;
    flex-wrap:wrap;
  }
  .dot{width:7px;height:7px;border-radius:50%;display:inline-block;}
  .dot.KR{background:var(--indigo);}
  .dot.JP{background:var(--seal);}
  .dot.CN{background:var(--gold);}

  .card p.blurb{
    font-size:14.5px;
    color:#3a332a;
    margin:0 0 16px;
    flex-grow:1;
  }

  .card .why{
    font-family:var(--font-body);
    font-size:13px;
    font-style:italic;
    color:var(--seal-deep);
    border-top:1px dashed var(--paper-dim);
    padding-top:13px;
    margin-bottom:2px;
  }
  .card .featured-tag{
    font-family:var(--font-body);
    font-weight:600;
    font-size:12.5px;
    color:var(--jade);
    border-top:1px dashed var(--paper-dim);
    padding-top:13px;
    margin-bottom:2px;
    letter-spacing:0.04em;
  }

  .wiki-link{
    display:inline-flex;
    align-items:center;
    gap:5px;
    margin-top:14px;
    font-family:var(--font-body);
    font-size:13px;
    color:var(--seal-deep);
    text-decoration:none;
    border-bottom:1px solid transparent;
    width:fit-content;
  }
  .wiki-link:hover{border-bottom-color:var(--seal-deep);}
  .wiki-link:focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .empty-state{
    border:1px dashed var(--ink-line);
    border-radius:var(--radius);
    padding:40px 24px;
    text-align:center;
    color:var(--text-quiet);
    font-family:var(--font-body);
    font-size:14px;
  }
  .empty-state .big{
    display:block;
    font-family:var(--font-display);
    font-size:22px;
    color:var(--text-loud);
    margin-bottom:10px;
  }

  footer{
    border-top:1px solid var(--ink-line);
    padding:28px 0 40px;
    font-family:var(--font-body);
    font-size:13px;
    color:var(--text-faint);
  }
  footer p{max-width:64ch;margin:0 0 8px;}

  @media (max-width:560px){
    .region-row{gap:8px;}
    .mood-grid{grid-template-columns:repeat(auto-fill, minmax(130px,1fr));}
    .header-right{align-items:flex-start;}
    .lang-switch{justify-content:flex-start;}
  }
</style>
</head>

<div class="ticker-bar">

</div>

<div class="wrap">
  <header class="site">
    <div class="brandrow">
      <div class="wordmark"><span id="wordmarkText"></span><small id="wordmarkSub"></small></div>
      <div class="header-right">
        <div class="lang-switch" id="langSwitch" role="group" aria-label="Language"></div>
        <div class="glyph-legend" id="glyphLegend"></div>
      </div>
    </div>
  </header>

  <section class="hero">

    <button class="btn primary" id="startBtn"><span id="startBtnText"></span> <span aria-hidden="true">↓</span></button>
  </section>

  <section class="tuner" id="tuner">
    <div class="section-head">
      <h2 id="moodSectionHeadingText"></h2>

    <p class="field-label" id="regionLabelText"></p>

    <p class="field-label" id="moodLabelText"></p>
    <div class="mood-grid" id="moodGrid" role="group" aria-label="Filter by mood or genre"></div>

    <div class="tuner-actions">
      <button class="btn primary" id="scanBtn"><span id="scanBtnText"></span> <span aria-hidden="true">↓</span></button>
      <button class="btn" id="surpriseBtn"><span id="surpriseBtnText"></span> <span aria-hidden="true">✦</span></button>
      <button class="clear-link" id="clearBtn"></button>
    </div>
  </section>

  <section class="lineup" id="lineup">
    <div class="section-head">
      <h2 id="lineupHeadingText"></h2>
    </div>
    <p class="results-meta" id="resultsMeta"></p>
    <div class="bonus-slot" id="bonusSlot"></div>
    <div class="grid" id="grid"></div>
  </section>

  <footer>
    <p id="footer1Text"></p>
    <p id="footer2Text"></p>
  </footer>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="roughEdge" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="6"/>
  </filter>
</svg>

  var TAG_IDS = Object.keys(TAG_LABELS.en);

  var LANG = 'en';
  var state = {region:'ALL', tags:new Set()};

  // ---------- language switcher ----------
  var LANGS = ['en','ko','ja','zh'];
  var langSwitch = document.getElementById('langSwitch');
  LANGS.forEach(function(code){
    var b = document.createElement('button');
    b.className = 'lang-btn';
    b.type = 'button';
    b.dataset.lang = code;
    b.setAttribute('aria-pressed', code === 'en' ? 'true' : 'false');
    b.textContent = UI[code].langName;
    b.addEventListener('click', function(){
      applyLanguage(code);
    });
    langSwitch.appendChild(b);
  });

  // ---------- ticker (titles stay in their original form across languages) ----------
  var tickerTrack = document.getElementById('tickerTrack');
  var tickerTitles = SHOWS.map(function(s){return '<span>'+s.title+'</span>';}).join('');
  tickerTrack.innerHTML = tickerTitles + tickerTitles;

  // ---------- region chips ----------
  var regionRow = document.getElementById('regionRow');
  var regionOrder = ['ALL','KR','JP','CN'];
  regionOrder.forEach(function(code){
    var b = document.createElement('button');
    b.className = 'chip-region';
    b.type = 'button';
    b.dataset.region = code;
    b.setAttribute('aria-pressed', code === 'ALL' ? 'true' : 'false');
    var glyph = code === 'ALL' ? '全' : COUNTRY_GLYPH[code];
    b.innerHTML = '<span class="glyph">'+glyph+'</span><span class="region-label"></span>';
    b.addEventListener('click', function(){
      state.region = code;
      Array.prototype.forEach.call(regionRow.children, function(chip){
        chip.setAttribute('aria-pressed', chip.dataset.region === code ? 'true' : 'false');
      });
      render();
    });
    regionRow.appendChild(b);
  });

  // ---------- mood chips ----------
  var moodGrid = document.getElementById('moodGrid');
  TAG_IDS.forEach(function(tagId){
    var b = document.createElement('button');
    b.className = 'chip-mood';
    b.type = 'button';
    b.dataset.tag = tagId;
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function(){
      if(state.tags.has(tagId)){
        state.tags.delete(tagId);
        b.setAttribute('aria-pressed','false');
      } else {
        state.tags.add(tagId);
        b.setAttribute('aria-pressed','true');
      }
      render();
    });
    moodGrid.appendChild(b);
  });

  document.getElementById('startBtn').addEventListener('click', function(){
    document.getElementById('tuner').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('scanBtn').addEventListener('click', function(){
    document.getElementById('lineup').scrollIntoView({behavior:'smooth', block:'start'});
  });
  document.getElementById('clearBtn').addEventListener('click', function(){
    state.tags.clear();
    Array.prototype.forEach.call(moodGrid.children, function(chip){
      chip.setAttribute('aria-pressed','false');
    });
    render();
  });
  document.getElementById('surpriseBtn').addEventListener('click', function(){
    var pool = SHOWS.filter(function(s){return state.region === 'ALL' || s.country === state.region;});
    if(pool.length === 0) return;
    var pick = pool[Math.floor(Math.random()*pool.length)];
    renderBonus(pick);
    document.getElementById('bonusSlot').scrollIntoView({behavior:'smooth', block:'center'});
  });

  function stampSVG(country){
    var glyph = COUNTRY_GLYPH[country];
    var color = country === 'KR' ? 'var(--indigo)' : (country === 'JP' ? 'var(--seal)' : 'var(--gold)');
    var textColor = country === 'CN' ? '#17130f' : '#f3ead9';
    return '<svg class="stamp" viewBox="0 0 64 64" role="img" aria-label="'+COUNTRY_NAMES[LANG][country]+' seal">'+
      '<g filter="url(#roughEdge)">'+
      '<circle cx="32" cy="32" r="27" fill="'+color+'" />'+
      '<circle cx="32" cy="32" r="27" fill="none" stroke="'+textColor+'" stroke-width="1.5" opacity="0.5"/>'+
      '</g>'+
      '<text x="32" y="41" text-anchor="middle" font-family="Zen Old Mincho, serif" font-size="26" fill="'+textColor+'">'+glyph+'</text>'+
      '</svg>';
  }

  function tagLabel(tagId){
    return TAG_LABELS[LANG][tagId] || tagId;
  }

  function metaFeatured(n, region){
    if(LANG==='en') return 'Showing <b>'+n+'</b> featured picks from <b>'+region+'</b>. Select a mood above to narrow the lineup.';
    if(LANG==='ko') return '<b>'+region+'</b> 지역의 추천작 <b>'+n+'</b>편을 보여드리고 있어요. 위에서 분위기를 골라보면 더 좁혀드릴게요.';
    if(LANG==='ja') return '<b>'+region+'</b>のおすすめ<b>'+n+'</b>作品を表示しています。上で気分を選ぶと絞り込めます。';
    return '正在展示来自<b>'+region+'</b>的<b>'+n+'</b>部精选剧。在上面选择心情可以进一步筛选。';
  }
  function metaMatches(n, region){
    if(LANG==='en') return 'Showing <b>'+n+'</b> match'+(n===1?'':'es')+' for your picks in <b>'+region+'</b>.';
    if(LANG==='ko') return '<b>'+region+'</b> 지역에서 취향에 맞는 작품 <b>'+n+'</b>편을 찾았어요.';
    if(LANG==='ja') return '<b>'+region+'</b>で、選んだ気分に合う作品が<b>'+n+'</b>件見つかりました。';
    return '在<b>'+region+'</b>找到<b>'+n+'</b>部符合你选择的剧。';
  }
  function metaNoMatches(region){
    if(LANG==='en') return 'No matches for this combination in <b>'+region+'</b>.';
    if(LANG==='ko') return '<b>'+region+'</b> 지역에는 이 조합에 맞는 작품이 없어요.';
    if(LANG==='ja') return '<b>'+region+'</b>には、この組み合わせに合う作品がありません。';
    return '<b>'+region+'</b>暂时没有符合这个组合的剧。';
  }
  function moodsSelectedText(n){
    if(LANG==='en') return n + (n===1 ? ' mood selected' : ' moods selected');
    if(LANG==='ko') return n + '개 선택됨';
    if(LANG==='ja') return n + '個選択中';
    return n + '个心情已选';
  }

  function cardHTML(show, index, matchedTags){
    var metaTags = show.tags.map(tagLabel).join(' · ');
    var seedRot = (show.id.charCodeAt(show.id.length-1) % 7) - 3;

    var whyBlock = '';
    if(matchedTags && matchedTags.length){
      var labels = matchedTags.map(tagLabel).join(', ');
      whyBlock = '<div class="why">'+UI[LANG].goodFitFor+' '+labels+'</div>';
    } else if(show.featured){
      whyBlock = '<div class="featured-tag">'+UI[LANG].featuredTonight+'</div>';
    }

    var blurbText = show.blurb[LANG] || show.blurb.en;

    return '<article class="card" style="transform:rotate('+ (seedRot*0.15) +'deg)">'+
      '<div class="card-top">' + stampSVG(show.country) + '</div>'+
      '<h3>'+show.title+'</h3>'+
      '<div class="card-meta"><span class="dot '+show.country+'"></span>'+COUNTRY_NAMES[LANG][show.country]+' &nbsp;·&nbsp; '+metaTags+'</div>'+
      '<p class="blurb">'+blurbText+'</p>'+
      whyBlock+
      '<a class="wiki-link" href="'+show.wiki+'" target="_blank" rel="noopener noreferrer">'+UI[LANG].wikiLinkText+' <span aria-hidden="true">&#8599;</span></a>'+
      '</article>';
  }

  function renderBonus(show){
    var slot = document.getElementById('bonusSlot');
    var html = '<h3 style="font-family:var(--font-body);font-weight:700;font-size:13px;letter-spacing:0.04em;color:var(--gold);margin:0 0 10px;">'+UI[LANG].bonusLabel+'</h3>';
    var wrap = document.createElement('div');
    wrap.className = 'grid';
    wrap.style.gridTemplateColumns = '1fr';
    wrap.style.maxWidth = '360px';
    wrap.innerHTML = cardHTML(show, SHOWS.indexOf(show), null).replace('class="card"','class="card bonus pulse"');
    slot.innerHTML = html;
    slot.appendChild(wrap);
  }

  function regionDisplayName(code){
    return code === 'ALL' ? UI[LANG].allRegions : COUNTRY_NAMES[LANG][code];
  }

  function render(){
    var selCount = document.getElementById('selCount');
    selCount.textContent = moodsSelectedText(state.tags.size);

    var pool = SHOWS.filter(function(s){return state.region === 'ALL' || s.country === state.region;});
    var meta = document.getElementById('resultsMeta');
    var grid = document.getElementById('grid');
    grid.innerHTML = '';

    var regionLabel = regionDisplayName(state.region);

    if(state.tags.size === 0){
      var featured = pool.filter(function(s){return s.featured;});
      if(featured.length === 0) featured = pool.slice(0,6);
      meta.innerHTML = metaFeatured(featured.length, regionLabel);
      featured.forEach(function(s, i){
        grid.insertAdjacentHTML('beforeend', cardHTML(s, i, null));
      });
      return;
    }

    var scored = pool.map(function(s){
      var matched = s.tags.filter(function(t){return state.tags.has(t);});
      return {show:s, matched:matched, score:matched.length};
    }).filter(function(x){return x.score > 0;});

    scored.sort(function(a,b){return b.score - a.score;});

    if(scored.length === 0){
      meta.innerHTML = metaNoMatches(regionLabel);
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><span class="big">'+UI[LANG].emptyBig+'</span>'+UI[LANG].emptySub+'</div>';
      return;
    }

    meta.innerHTML = metaMatches(scored.length, regionLabel);
    scored.forEach(function(x, i){
      grid.insertAdjacentHTML('beforeend', cardHTML(x.show, i, x.matched));
    });
  }

  function applyLanguage(lang){
    LANG = lang;
    document.documentElement.lang = HTML_LANG[lang];
    document.title = UI[lang].brandName;

    Array.prototype.forEach.call(langSwitch.children, function(btn){
      btn.setAttribute('aria-pressed', btn.dataset.lang === lang ? 'true' : 'false');
    });

    document.getElementById('wordmarkText').textContent = UI[lang].brandName;
    document.getElementById('wordmarkSub').innerHTML = UI[lang].brandSub;
    document.getElementById('eyebrowText').textContent = UI[lang].eyebrow;
    document.getElementById('headlineText').textContent = UI[lang].headline;
    document.getElementById('subText').textContent = UI[lang].sub;
    document.getElementById('startBtnText').textContent = UI[lang].getStarted;
    document.getElementById('moodSectionHeadingText').textContent = UI[lang].moodSectionHeading;
    document.getElementById('regionLabelText').textContent = UI[lang].regionLabel;
    document.getElementById('moodLabelText').innerHTML = UI[lang].moodLabel;
    document.getElementById('scanBtnText').textContent = UI[lang].seeLineup;
    document.getElementById('surpriseBtnText').textContent = UI[lang].surpriseMe;
    document.getElementById('clearBtn').textContent = UI[lang].clearMoods;
    document.getElementById('lineupHeadingText').textContent = UI[lang].lineupHeading;
    document.getElementById('footer1Text').textContent = UI[lang].footer1;
    document.getElementById('footer2Text').textContent = UI[lang].footer2;

    document.getElementById('glyphLegend').innerHTML =
      '<span><b>韓</b>'+COUNTRY_NAMES[lang].KR+'</span>'+
      '<span><b>日</b>'+COUNTRY_NAMES[lang].JP+'</span>'+
      '<span><b>中</b>'+COUNTRY_NAMES[lang].CN+'</span>';

    Array.prototype.forEach.call(regionRow.children, function(chip){
      var code = chip.dataset.region;
      chip.querySelector('.region-label').textContent = regionDisplayName(code);
    });

    Array.prototype.forEach.call(moodGrid.children, function(chip){
      chip.textContent = tagLabel(chip.dataset.tag);
    });

    document.getElementById('bonusSlot').innerHTML = '';

    render();
  }

  applyLanguage('en');
})();
</script>
</body>
</html>
